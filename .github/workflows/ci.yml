name: CI

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      expected-version:
        type: string
        default: ""
    outputs:
      release-artifact-id:
        value: ${{ jobs.package.outputs.release-artifact-id }}
      manifest-sha256:
        value: ${{ jobs.package.outputs.manifest-sha256 }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # GitHub's PR files API caps responses at 3,000 files. Such PRs run every check.
      full: ${{ github.event_name != 'pull_request' && 'true' || github.event.pull_request.changed_files >= 3000 && 'true' || steps.filter.outputs.full }}
    steps:
      - name: Identify changes requiring full validation
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          # Everything outside these known Markdown paths requires full validation.
          # Renames test both the old and new paths; deletions also participate.
          filters: |
            full:
              - '**'
              - '!{AGENTS,CHANGELOG,CODE_OF_CONDUCT,CONTRIBUTING,README,ROADMAP,SECURITY,SUPPORT}.md'
              - '!docs/{index,native-runs,results,cli,troubleshooting,measurements,architecture}.md'
              - '!docs/decisions/*.md'
              - '!docs/research/*.md'
              - '!research/{fuzzing,reduction}/README.md'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The action treats incomplete snapshots as warnings, even after polling times out.
      - name: Require complete dependency snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          headers=$(gh api --include --silent --paginate \
            "repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          if grep -qi '^x-github-dependency-graph-snapshot-warnings:[[:space:]]*[^[:space:]]' <<< "$headers"; then
            echo "::error::Dependency snapshots are incomplete. Wait for the graph update, then rerun this job."
            exit 1
          fi

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false

  workflows:
    name: Workflows
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This existing required check must fail if classification failed or produced no decision.
      - name: Require successful change classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          FULL_VALIDATION: ${{ needs.changes.outputs.full }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          case "$FULL_VALIDATION" in
            true|false) ;;
            *) echo "::error::Missing or invalid change classification"; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows and Dependabot configuration
        uses: jdx/jactionlint@a65ab044e916760429068fe5794b8306abdfcbb9 # v2.3.0
        with:
          profile: default
          online: "false"
          token: ""
          strict-exit: "true"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
          save-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups --all-extras

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Report code metrics
        run: |
          uv run radon cc src/ithrl --min B --show-complexity --total-average
          uv run radon mi src/ithrl --min B --show

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run pyrefly check

      - name: Check reduction research reference
        run: |
          uv run --offline --no-sync python research/reduction/reproduce.py freeze --output research/reduction/outputs/ci
          uv run --offline --no-sync python research/reduction/reproduce.py verify --output research/reduction/outputs/ci
          uv run --offline --no-sync pytest -o addopts= research/reduction/test_reproduce.py -q

  test:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups --all-extras

      - name: Audit locked dependencies
        shell: bash
        run: |
          uv export --locked --all-groups --all-extras --no-emit-project --format requirements.txt |
            uv run --locked --group audit pip-audit --strict --disable-pip --require-hashes -r /dev/stdin

      - name: Run tests
        run: uv run pytest --ignore=tests/packaging

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
          save-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Check Markdown formatting and lint
        run: |
          uv run rumdl fmt --check .
          uv run rumdl check .

      - name: Check CLI reference, site boundaries and issue forms
        run: uv run pytest -o addopts= tests/unit/test_documentation.py -q

      - name: Build public documentation and check links
        run: uv run --group docs mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-artifact-id: ${{ steps.release.outputs.artifact-id }}
      manifest-sha256: ${{ steps.prepare.outputs.manifest-sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
          save-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Build artifacts
        run: uv build --sdist --wheel --no-sources

      - name: Save distributions for installation tests
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release notes and checksums
        if: inputs.release
        id: prepare
        run: uv run python scripts/release.py prepare
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}

      - name: Save identified release files
        if: inputs.release
        id: release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: .local/release/
          if-no-files-found: error
          retention-days: 30

  package-test:
    name: Package Python ${{ matrix.python-version }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          save-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Retrieve this run's distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release && 'release-distributions' || 'python-distributions' }}
          path: ${{ inputs.release && '.local/release' || 'dist' }}

      - name: Validate artifacts and clean installation
        run: uv run pytest -o addopts= tests/packaging
        env:
          ITHRL_DIST_DIR: ${{ inputs.release && '.local/release/dist' || 'dist' }}
