name: Documentation site

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  build:
    name: Build documentation
    if: github.repository == 'eberkut/ithrl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Check CLI reference, site boundaries and issue forms
        run: uv run pytest -o addopts= tests/unit/test_documentation.py -q

      - name: Build public documentation and check links
        run: uv run --group docs mkdocs build --strict

      - name: Upload generated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .local/site
          retention-days: 1

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
