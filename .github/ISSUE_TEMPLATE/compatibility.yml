name: Compatibility report
description: Report a harness, platform or version compatibility problem.
body:
  - type: markdown
    attributes:
      value: |
        A native refusal can protect an unsupported safety boundary. Include the refusal code and
        sanitized steps so we can distinguish a changed native contract from local configuration.
        Do not upload private sessions, proprietary source, credentials, raw cases, observation databases or
        unreviewed diagnostic bundles. Use [private reporting](https://github.com/eberkut/ithrl/security/advisories/new)
        for suspected vulnerabilities.
  - type: input
    id: version
    attributes:
      label: ithrl version
      description: Output of ithrl --version, or the commit if running a checkout.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python and operating system
      placeholder: Python version, OS version and architecture
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: Include the native CLI version. For a platform-only report, enter not applicable.
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Affected operation
      options:
        - Installation
        - Session extraction
        - Native preflight
        - Model-backed execution
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Sanitized reproduction and expected result
      description: Include exact commands, target type, and relevant configuration without account details.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and refusal code
      description: Include sanitized error text and exit code. Note the last known working version if known.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Report safety
      options:
        - label: I have checked that this report and any attachments contain no private or sensitive data.
          required: true
