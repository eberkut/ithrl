name: Question or proposal
description: Ask a usage question or discuss a change before implementation.
body:
  - type: markdown
    attributes:
      value: |
        Check [the documentation](https://github.com/eberkut/ithrl#documentation) and existing issues first.
        Discuss changes here before preparing a pull request; pull requests are limited to collaborators.
        Do not include private sessions, proprietary source, credentials, raw cases, observation databases or
        unreviewed diagnostic bundles. Use [private reporting](https://github.com/eberkut/ithrl/security/advisories/new)
        for suspected vulnerabilities.
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - Usage question
        - Documentation improvement
        - Feature or workflow proposal
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Question or problem to solve
      description: Explain your goal, what you tried, and any relevant documentation gap.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant version and environment
      description: For usage questions, include ithrl, Python, OS and relevant harness versions.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach and alternatives
      description: Optional for questions. For changes, describe the desired outcome and alternatives.
  - type: checkboxes
    id: privacy
    attributes:
      label: Report safety
      options:
        - label: I have checked that this report and any attachments contain no private or sensitive data.
          required: true
