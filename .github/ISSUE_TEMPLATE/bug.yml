name: Bug report
description: Report a reproducible defect in an implemented command.
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use [private reporting](https://github.com/eberkut/ithrl/security/advisories/new).
        Share only sanitized text and synthetic reproductions. Do not upload private sessions, proprietary source,
        credentials, raw cases, observation databases or unreviewed diagnostic bundles.
  - type: input
    id: version
    attributes:
      label: ithrl version
      description: Output of ithrl --version, or the commit if running a checkout.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python and operating system
      placeholder: Python version, OS version and architecture
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: If relevant, include the native CLI version. Do not include account details.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic input and exact commands. Replace private paths and content.
      placeholder: |
        1. Create this synthetic input...
        2. Run this command...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized diagnostics
      description: Include the exit code and refusal or error code. Review output before sharing.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Report safety
      options:
        - label: I have checked that this report and any attachments contain no private or sensitive data.
          required: true
